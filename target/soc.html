<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Diya SOC: Red vs Blue on BAND</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#0f0b08;--panel:#1a140f;--line:#2e241b;--text:#f4e9dc;--muted:#a8957f;--red:#ff5a4e;--blue:#4ea3ff;--gold:#ffb547}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 ui-sans-serif,system-ui,-apple-system,sans-serif}
header{padding:28px 32px 8px;display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
h1{margin:0;font-size:26px;letter-spacing:-.01em}h1 span{color:var(--gold)}
.sub{color:var(--muted)}
main{display:grid;grid-template-columns:minmax(300px,1fr) 1.4fr;gap:20px;padding:20px 32px 32px}
section{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
h2{margin:0 0 12px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.vuln{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.vuln:first-of-type{border-top:0}
.pill{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px}
.open{background:#3a1512;color:var(--red)}.fixed{background:#10233a;color:var(--blue)}
.score{font-size:44px;font-weight:700;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.diyas{display:flex;gap:10px;margin:10px 0 4px}.diya{width:26px;height:26px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:#3b2c1e;transition:background .4s,box-shadow .4s}
.diya.lit{background:var(--gold);box-shadow:0 0 18px 4px #ffb54788}
#feed{max-height:62vh;overflow:auto;font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace}
.ev{padding:7px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:92px 74px 1fr;gap:10px}
.t{color:var(--muted)}.k-red{color:var(--red)}.k-blue{color:var(--blue)}.k-ok{color:var(--gold)}
@media (max-width:820px){main{grid-template-columns:1fr}}
</style></head><body>
<header><h1>Diya <span>SOC</span></h1><div class="sub">Red and Blue agents collaborating in a BAND room, live against the range</div></header>
<main>
<section><h2>Attack surface</h2>
<div class="score" id="score">0 / 4</div><div class="sub">exploits closed</div>
<div class="diyas" id="diyas"></div>
<div id="vulns" style="margin-top:14px"></div></section>
<section><h2>Live range feed</h2><div id="feed"></div></section>
</main>
<script>
async function tick(){
  const s = await (await fetch('/soc/state')).json();
  const keys = Object.keys(s.vulns), fixed = keys.filter(k=>s.patches[k]);
  document.getElementById('score').textContent = `${fixed.length} / ${keys.length}`;
  document.getElementById('diyas').innerHTML = keys.map(k=>`<div class="diya ${s.patches[k]?'lit':''}" title="${s.vulns[k]}"></div>`).join('');
  document.getElementById('vulns').innerHTML = keys.map(k=>`<div class="vuln"><span>${s.vulns[k]}</span><span class="pill ${s.patches[k]?'fixed':'open'}">${s.patches[k]?'Patched':'Exploitable'}</span></div>`).join('');
  const rows = s.events.slice().reverse().map(e=>{
    const t = new Date(e.t*1000).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});
    if(e.kind==='patch') return `<div class="ev"><span class="t">${t}</span><span class="k-blue">BLUE</span><span>Deployed patch: ${(e.enabled||[]).join(', ')}</span></div>`;
    const who = e.blocked ? '<span class="k-ok">BLOCKED</span>' : '<span class="k-red">RED HIT</span>';
    return `<div class="ev"><span class="t">${t}</span>${who}<span>${s.vulns[e.vuln]||e.vuln}</span></div>`;
  });
  document.getElementById('feed').innerHTML = rows.join('') || '<div class="sub">Waiting for the Red agent…</div>';
}
tick(); setInterval(tick, 1000);
</script></body></html>
